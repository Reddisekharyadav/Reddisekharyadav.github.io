<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <style>
      @keyframes rotate3d {
        0% { transform: rotateX(0deg) rotateY(0deg); }
        100% { transform: rotateX(360deg) rotateY(360deg); }
      }
      .cube-3d {
        animation: rotate3d 8s infinite linear;
        transform-style: preserve-3d;
      }
    </style>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f7ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8338ec;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#0a0e27"/>

  <!-- Animated Cube -->
  <g class="cube-3d" transform="translate(600, 300)">
    <!-- Front face -->
    <rect x="-80" y="-80" width="160" height="160" fill="url(#heroGradient)" opacity="0.9"/>
    <!-- Back face -->
    <rect x="-70" y="-70" width="140" height="140" fill="#00f7ff" opacity="0.3" transform="translate(20, 20)"/>
    <!-- Top face -->
    <polygon points="-80,-80 80,-80 90,-90 -90,-90" fill="#ff006e" opacity="0.7"/>
  </g>

  <!-- Text -->
  <text x="600" y="500" text-anchor="middle" font-size="48" font-family="Arial, sans-serif" fill="#00f7ff" font-weight="bold">
    Full Stack Developer
  </text>
  <text x="600" y="550" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" fill="#ff006e">
    Welcome to my Portfolio
  </text>
</svg>